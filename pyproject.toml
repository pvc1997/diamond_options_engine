[project]
name = "diamond-options-engine"
version = "0.1.0"
description = "Systematic Indian options trading engine with mathematical trade suggestions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.66",
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "typer[all]>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
options = "diamond_options.cli:app"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/diamond_options"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
